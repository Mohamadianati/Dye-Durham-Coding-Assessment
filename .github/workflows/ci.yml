name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore Sorter.sln

      - name: Build
        run: dotnet build Sorter.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Sorter.sln --configuration Release --no-build
